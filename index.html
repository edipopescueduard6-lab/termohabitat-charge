/* ---------- bază ---------- */
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--f-body);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
button,a,.chip,.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s16{width:15px;height:15px}.ic.s18{width:17px;height:17px}.ic.s20{width:19px;height:19px}.ic.s26{width:23px;height:23px}.ic.s28{width:25px;height:25px}.ic.s32{width:28px;height:28px}
.ic .f{fill:currentColor;stroke:none}
.num{font-family:var(--f-round);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:0;font-size:.92em;font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.faint-t{color:var(--muted)}
.nowrap{white-space:nowrap}
.ellip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{display:flex;justify-content:center}
.center-t{align-items:center;text-align:center}
.err{color:var(--st-fault-ink)!important}

/* ---------- scena (desktop = ramă de telefon) ---------- */
.stage{height:100%;display:flex;justify-content:center}
.rail{display:none}
.device{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;isolation:isolate}
.sbar,.island{display:none}
@media (min-width:980px){
  body{background:var(--stage)}
  .stage{display:grid;grid-template-columns:minmax(230px,270px) auto;justify-content:center;align-items:center;gap:clamp(28px,4vw,64px);padding-inline:28px;padding-block:20px}
  .rail{display:flex;flex-direction:column;gap:16px;max-height:100%;overflow:auto;color:var(--stage-ink);scrollbar-width:thin}
  .device{width:393px;height:min(852px,calc(100dvh - 40px));border-radius:54px;box-shadow:0 0 0 11px var(--bezel),0 0 0 12px #3a3f39,0 40px 90px rgb(0 0 0 / .28);--sbar-h:50px;--sab:20px;
    /* variabilele derivate se recalculează aici, altfel rămân cu valorile de la :root */
    --top:calc(var(--sbar-h) + var(--sat));--tab-gap:max(10px, calc(var(--sab) - 14px));--tabbar-h:calc(var(--tab-core) + var(--tab-gap))}
  .sbar{display:flex;position:absolute;z-index:60;top:0;left:0;right:0;height:50px;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font:600 15px var(--f-body);color:var(--text);pointer-events:none;font-variant-numeric:tabular-nums}
  .sbar .sb-ic{display:flex;gap:6px;align-items:center}
  .island{display:block;position:absolute;z-index:61;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;pointer-events:none}
  .device .art{height:calc(200px + var(--top))}
}
@media (min-width:1300px){.stage{grid-template-columns:minmax(230px,270px) auto minmax(270px,320px)}.rail-r{display:flex}}
@media (max-width:1299.98px){.rail-r{display:none!important}}
@media (min-width:600px) and (max-width:979.98px){body{background:var(--stage)}.device{max-width:520px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgb(0 0 0 / .15)}}
.rail h1{font:700 22px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--stage-ink)}
.rail .rail-logo img{height:30px;width:auto}
.rail .rail-sub{font-size:13px;line-height:1.5;color:var(--stage-ink);opacity:.8;max-width:34ch}
.rail-group{display:flex;flex-direction:column;gap:6px}
.rail-group .eyebrow{color:var(--stage-ink);opacity:.85}
.rail-list{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.rail-list button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:500;color:var(--stage-ink)}
.rail-list button:hover{background:rgb(127 140 118 / .16)}
.rail-list button[aria-current="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.rail-list .ic{width:16px;height:16px}
.rail .seg{background:rgb(127 140 118 / .16)}
.rail .seg button{color:var(--stage-ink)}
.rail .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.rail-note{font-size:12px;line-height:1.5;color:var(--stage-ink);opacity:.85}

/* ---------- aplicația ---------- */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.view{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:var(--top);padding-bottom:calc(var(--tabbar-h) + 20px);background:var(--bg);scrollbar-width:none;scroll-padding-top:60px;scroll-padding-bottom:calc(var(--tabbar-h) + 20px)}
.scr::-webkit-scrollbar{display:none}
.scr.no-tabs{padding-bottom:calc(24px + var(--sab));scroll-padding-bottom:96px}
.scr.flush{padding-top:0}
.scr.lock{overflow:hidden}
.scr.has-cta{padding-bottom:0}
.app.has-pill .scr:not(.no-tabs){padding-bottom:calc(var(--tabbar-h) + 84px)}
.scr.enter-push{animation:pushIn .34s cubic-bezier(.2,.8,.2,1)}
.scr.enter-pop{animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
.scr.enter-fade{animation:fadeIn .22s ease-out}
@keyframes pushIn{from{transform:translateX(30%);opacity:.3}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-16%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pad{padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-l{display:flex;flex-direction:column;gap:22px}
.hrow{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}

/* bara de navigare */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 8px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px)}
.topbar .tb-title{flex:1;min-width:0;font-weight:600;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-side{width:40px;display:flex;justify-content:center}
.topbar .iconbtn{width:36px;height:36px;border-radius:50%}
.scr-head{padding:8px 16px 12px;display:flex;flex-direction:column;gap:2px}
.h-screen{font:700 28px/1.1 var(--f-display);letter-spacing:-.022em}
.h-sec{font:600 19px/1.2 var(--f-display);letter-spacing:-.015em}
.sec{display:flex;flex-direction:column;gap:8px;padding-inline:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 4px 0}
.sec-head .h-sec{font-size:17px}
.link{border:0;background:none;padding:4px 2px;font-weight:500;font-size:15px;color:var(--brand-ink)}

/* butoane */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .34s var(--spring),background-color .15s ease,opacity .15s,box-shadow .2s}
.btn:active{transform:scale(.95);transition-duration:.08s,.15s,.15s,.2s}
.btn .ic{transition:transform .34s var(--spring)}
.btn:active .ic{transform:scale(.9)}
/* undă la apăsare (poziționată din JS, la locul degetului) */
.tapfx{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:translate(-50%,-50%) scale(0);animation:tapfx .55s var(--ease-out) forwards}
@keyframes tapfx{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.btn-primary{box-shadow:0 1px 0 rgb(255 255 255 / .25) inset,0 4px 14px color-mix(in srgb,var(--brand) 28%,transparent)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-dark{background:var(--inverse-bg);color:var(--inverse-text)}
.btn-ghost{background:var(--fill);color:var(--text)}
.btn-line{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn-danger{background:var(--st-fault-soft);color:var(--st-fault-ink)}
.btn-lg{height:50px;border-radius:14px;font-size:16px;padding:0 20px}
.btn-sm{height:32px;border-radius:9px;font-size:13.5px;padding:0 12px}
.btn-block{width:100%}
a.btn{text-decoration:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--text);box-shadow:var(--shadow-float);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.iconbtn.flat{box-shadow:none;background:var(--fill)}
.iconbtn.bare{box-shadow:none;background:transparent}
/* animații de apăsare pentru toate elementele pe care se poate atinge: coboară rapid, revin cu arc */
.iconbtn,.avatar,.chip,.link,.seg button,.srow,.conn,.opt,.veh,.rfid,.pin .pb,.sl-knob,.stepdot,.faq summary,.tag[data-act]{transition:transform .34s var(--spring),background-color .18s,box-shadow .2s,color .18s,opacity .18s}
.iconbtn:active,.avatar:active{transform:scale(.86);transition-duration:.08s}
.chip:active,.link:active,.seg button:active{transform:scale(.93);transition-duration:.08s}
.srow:active,.conn:active,.opt:active,.veh:active{transform:scale(.975);transition-duration:.1s}
.rfid:active{transform:scale(.96) rotate(-.6deg);transition-duration:.1s}
.pin:active .pb{transform:scale(.9);transition-duration:.08s}
button.row,a.row{transition:background-color .2s}
a.row:active{background:var(--fill)}
button.row:active .tile{transform:scale(.88)}
.tile{transition:transform .34s var(--spring)}
.iconbtn[aria-pressed="true"] .ic{animation:tabPop .45s var(--spring)}
.chip[aria-pressed="true"]{animation:chipOn .35s var(--spring)}
@keyframes chipOn{0%{transform:scale(.92)}100%{transform:none}}
.link{border-radius:8px}
[tabindex="-1"]:focus{outline:none}
/* intrarea în ecran: blocurile urcă ușor, pe rând */
.rise-in{animation:riseIn .52s var(--ease-out) backwards}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}}

/* cipuri, stări */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chips.float{padding-block:4px 12px;margin-block:-4px -12px;margin-inline:-12px;padding-inline:12px}
.chips.bleed{margin-inline:-16px;padding-inline:16px}
.chip{height:32px;flex:none;padding:0 12px;border-radius:16px;border:0;background:var(--surface);display:inline-flex;align-items:center;gap:5px;font-weight:500;font-size:14px;color:var(--text);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line)}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--inverse-bg);color:var(--inverse-text);box-shadow:none}
.chips.float .chip,.chips.float .chip[aria-pressed="true"]{box-shadow:var(--shadow-float)}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-free{background:var(--st-free-soft);color:var(--st-free-ink)}
.st-busy{background:var(--st-busy-soft);color:var(--st-busy-ink)}
.st-busy2{background:var(--warn-soft);color:var(--warn-ink)}
.st-busy2::before{animation:blink 1.2s ease-in-out infinite}
.st-fault{background:var(--st-fault-soft);color:var(--st-fault-ink)}
.st-off{background:var(--st-off-soft);color:var(--st-off-ink)}
.st-res{background:var(--st-res-soft);color:var(--st-res-ink)}
.st-nosig{background:transparent;color:var(--st-off-ink);outline:1.2px dashed var(--st-off);outline-offset:-1.2px}
.st-live{background:var(--brand);color:var(--on-brand)}
.st-live::before{animation:blink 1.2s ease-in-out infinite}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:500;background:var(--fill);color:var(--text-2);white-space:nowrap}
.tag .ic{width:13px;height:13px}
.tag.tag-xs{height:18px;font-size:11px;padding:0 6px}
.tag.tag-md{height:28px;padding:0 10px;font-size:13px}
.tag .cnt{color:var(--muted)}
.tag[data-on]{box-shadow:inset 0 0 0 1.2px currentColor}
.tag-day{background:var(--day-soft);color:var(--day-ink)}
.tag-night{background:var(--night-soft);color:var(--night-ink)}
.tag-solar{background:var(--solar-soft);color:var(--day-ink)}
.tag-brand{background:var(--brand-soft);color:var(--brand-ink)}
.tag-warn{background:var(--warn-soft);color:var(--warn-ink)}
@keyframes blink{50%{opacity:.25}}

/* liste grupate (ca în Setări) */
.card{background:var(--surface);border-radius:14px}
.card.p{padding:14px}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.list.flat{background:var(--surface-2)}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:9px 14px;border:0;background:transparent;text-align:left;color:var(--text)}
.row+.row::before,.veh+.veh::before{content:"";position:absolute;top:0;right:0;left:56px;height:.5px;background:var(--sep)}
.list.flat .row+.row::before{left:14px}
.row:not(:has(.tile))+.row::before{left:14px}
button.row:active,.veh:active{background:var(--fill)}
.row .r-title{display:block;font-weight:400;font-size:15.5px;line-height:1.25}
.row .r-sub{display:block;font-size:13px;color:var(--muted);line-height:1.3;margin-top:1px}
.row .r-val{font-size:15px;color:var(--muted);white-space:nowrap}
.tile{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--t-grey);color:#fff}
.tile .ic{width:17px;height:17px;stroke-width:1.9}
.tile.brand{background:var(--t-green)}
.tile.day{background:var(--t-orange)}
.tile.night{background:var(--t-indigo)}
.tile.solar{background:var(--t-yellow)}
.tile.res{background:var(--t-purple)}
.tile.fault{background:var(--t-red)}
.tile.lg{width:44px;height:44px;border-radius:12px}
.tile.lg .ic{width:24px;height:24px}
/* rezumate de cifre: o singură suprafață cu separatoare fine, nu dale separate */
.kv,.kv3{display:grid;background:var(--surface);border-radius:14px;overflow:hidden}
.kv{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv.pad{margin-inline:16px;padding-inline:0}
.stat{position:relative;padding:11px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kv .stat:nth-child(2n)::before,.kv3 .stat:not(:nth-child(3n+1))::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.kv .stat:nth-child(n+3)::after,.kv3 .stat:nth-child(n+4)::after{content:"";position:absolute;left:14px;right:14px;top:0;height:.5px;background:var(--sep)}
.stat .s-l{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s-v{font-family:var(--f-round);font-weight:650;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .s-v small{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.stat .s-d{font-size:12px;color:var(--muted)}
@media (max-width:380px){.stat .s-l{white-space:normal}}
.divider{height:.5px;background:var(--sep);margin-block:2px}
/* note: implicit ca text de subsol (fără cutie); colorate doar pentru stări importante */
.note{display:flex;gap:8px;align-items:flex-start;padding:0 4px;font-size:13px;color:var(--muted);line-height:1.4}
.note .ic{width:15px;height:15px;margin-top:1px;flex:none}
.note.brand,.note.night,.note.day,.note.bad,.note.box{padding:10px 12px;border-radius:12px;color:var(--text-2)}
.note.brand{background:var(--brand-soft)}
.note.night{background:var(--night-soft)}
.note.day{background:var(--day-soft)}
.note.bad{background:var(--st-fault-soft)}
.note.box{background:var(--surface)}

/* controale */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--control-line);transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgb(0 0 0 / .2);transition:transform .22s cubic-bezier(.3,.7,.3,1)}
.sw input:checked+span{background:var(--t-green)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2.5px solid var(--focus);outline-offset:2px}
.seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{flex:1;min-width:0;height:30px;border:0;border-radius:7px;background:transparent;font-weight:500;font-size:13.5px;color:var(--text);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / .12),0 2px 8px rgb(0 0 0 / .06),inset 0 0 0 .5px var(--seg-ring);animation:segIn .38s var(--spring)}
@keyframes segIn{0%{transform:scale(.9);opacity:.6}100%{transform:none;opacity:1}}
.opt[aria-pressed="true"] .radio::after,.opt[aria-checked="true"] .radio::after{animation:dotPop .4s var(--spring)}
@keyframes dotPop{0%{transform:scale(0)}100%{transform:none}}
.sw span::after{transition:transform .32s var(--spring),width .2s}
.sw input:active+span::after{width:32px}
.sw input:checked:active+span::after{transform:translateX(15px)}
.range{width:100%;accent-color:var(--t-green);height:26px}
.rng-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:-2px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600;color:var(--muted);padding-left:4px}
.input{height:44px;border-radius:11px;border:1px solid var(--control-line);background:var(--surface);padding:0 12px;font-size:16px;width:100%;color:var(--text)}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.input.mono{font-size:16px;letter-spacing:.02em}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.opt{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--surface);text-align:left;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--surface))}
.opt[disabled]{opacity:.5;cursor:not-allowed}
.opt .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--control-line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .radio,.opt[aria-checked="true"] .radio{border-color:var(--t-green);background:var(--t-green)}
.opt[aria-pressed="true"] .radio::after,.opt[aria-checked="true"] .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.opt b{font-weight:600}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-inline:16px;scroll-padding-inline:16px;padding-block:6px 22px;margin-block:-6px -22px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}

/* glisează pentru confirmare */
.slide{position:relative;height:56px;border-radius:16px;background:var(--inverse-bg);color:var(--inverse-text);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.slide .sl-fill{position:absolute;inset:0 auto 0 0;width:56px;background:var(--brand);border-radius:16px;opacity:.95}
.slide .sl-label{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:15px;padding-left:44px;pointer-events:none;background:linear-gradient(90deg,var(--inverse-text) 0%,var(--inverse-text) 40%,color-mix(in srgb,var(--inverse-text) 35%,transparent) 50%,var(--inverse-text) 60%,var(--inverse-text) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 2.6s linear infinite}
.slide .sl-knob{position:absolute;top:4px;left:4px;width:48px;height:48px;border-radius:13px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 2px 6px rgb(0 0 0 / .25);cursor:grab;touch-action:none}
.slide .sl-knob:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--inverse-bg),inset 0 0 0 5px var(--inverse-text)}
.slide.danger .sl-fill,.slide.danger .sl-knob{background:#F0665B;color:#1b0d0b}
.slide.done .sl-label{animation:none}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}

/* bara de taburi plutitoare (ca pe iOS 26): capsulă de sticlă, iconițe centrate, scanarea la mijloc */
.tabbar{position:absolute;z-index:40;left:12px;right:12px;bottom:var(--tab-gap);height:var(--tab-core);border-radius:calc(var(--tab-core) / 2);padding:0 5px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.9) blur(26px);-webkit-backdrop-filter:saturate(1.9) blur(26px);box-shadow:0 0 0 .5px var(--sep),0 10px 30px rgb(20 28 16 / .16),0 2px 6px rgb(20 28 16 / .06);animation:barIn .5s var(--spring) backwards}
@keyframes barIn{from{transform:translateY(24px);opacity:0}}
/* conținutul se stinge sub capsulă, nu se vede prin ea */
.app.tabs-on::after{content:"";position:absolute;z-index:38;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + 26px);background:linear-gradient(0deg,var(--bg) 0%,var(--bg) 60%,color-mix(in srgb,var(--bg) 0%,transparent) 100%);pointer-events:none}
.app.tabs-on.on-scan::after{display:none}
.app.on-scan .tabbar{background:rgb(30 35 30 / .9);box-shadow:0 0 0 .5px rgb(255 255 255 / .1),0 10px 30px rgb(0 0 0 / .4)}
.app.on-scan .tab{color:#A9B3A4}
.app.on-scan .tab::before{background:rgb(255 255 255 / .1)}
.tab{position:relative;height:52px;border:0;border-radius:26px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:color .2s,transform .25s var(--spring)}
.tab::before{content:"";position:absolute;inset:0 3px;border-radius:26px;background:var(--brand-soft);opacity:0;transform:scale(.7);transition:opacity .25s,transform .35s var(--spring)}
.tab>*{position:relative}
.tab .ic{width:24px;height:24px;stroke-width:1.6;transition:transform .35s var(--spring)}
.tab[aria-current="page"]{color:var(--brand-ink)}
.tab[aria-current="page"]::before{opacity:1;transform:none}
.tab[aria-current="page"] .ic{stroke-width:2;animation:tabPop .45s var(--spring)}
@keyframes tabPop{0%{transform:scale(.8)}60%{transform:scale(1.14)}100%{transform:none}}
.tab:active{transform:scale(.9)}
.tab-scan{position:relative;height:52px;border:0;background:transparent;display:grid;place-items:center}
.tab-scan .fab{width:50px;height:50px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 4px 14px rgb(60 120 30 / .38),inset 0 1px 0 rgb(255 255 255 / .35);transition:transform .3s var(--spring),box-shadow .2s}
.tab-scan .fab::after{content:"";position:absolute;inset:1px;border-radius:50%;box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 60%,transparent);animation:scanPing 3.2s ease-out 1.2s 2}
@keyframes scanPing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 55%,transparent)}70%,100%{box-shadow:0 0 0 12px transparent}}
.tab-scan:active .fab{transform:scale(.88)}
.tab-scan[aria-current="page"] .fab{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 35%,transparent),0 4px 14px rgb(60 120 30 / .38)}
.tab-scan .fab .ic{width:25px;height:25px;stroke-width:2}
.tab-scan .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* pastila de încărcare activă (doar când insula nu e disponibilă) */
.livepill{position:absolute;z-index:39;left:12px;right:12px;bottom:calc(var(--tabbar-h) + 8px);display:flex;align-items:center;gap:11px;height:54px;padding:0 14px 0 7px;border-radius:27px;border:0;background:var(--live-bg);color:var(--live-text);box-shadow:var(--shadow-float);text-align:left;animation:pillIn .45s var(--spring) backwards;transition:transform .25s var(--spring)}
@keyframes pillIn{from{transform:translateY(18px) scale(.96);opacity:0}}
.livepill:active{transform:scale(.97)}
.livepill .lp-bolt{border-radius:50%!important}
.livepill.inline{position:relative;left:auto;right:auto;bottom:auto;width:100%;animation:none;box-shadow:none}
.livepill .lp-bolt{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
:root[data-theme="dark"] .livepill .lp-bolt{background:var(--live-text);color:var(--brand)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .livepill .lp-bolt{background:var(--live-text);color:var(--brand)}}
.livepill .lp-bolt::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,transparent 0%,rgb(255 255 255 / .5) 50%,transparent 100%);animation:rise 1.5s linear infinite}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(-100%)}}
.livepill .lp-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.livepill .lp-t{font-size:12px;font-weight:500;color:var(--live-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.livepill .lp-kw{font:650 19px var(--f-round);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.livepill .lp-kw small{font-size:12.5px;font-weight:600;margin-left:2px}
.livepill .lp-side{text-align:right;display:flex;flex-direction:column;line-height:1.2;font-variant-numeric:tabular-nums}
.livepill .lp-side b{font-size:14.5px;font-weight:600}
.livepill .lp-side span{font-size:12px;color:var(--live-sub)}

/* foi modale */
.modal{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;background:var(--scrim);animation:scrimIn .22s ease-out}
@keyframes scrimIn{from{background:transparent}}
.modal.out{animation:scrimOut .24s ease-in forwards;pointer-events:none}
.modal.out .msheet{animation:sheetDown .24s cubic-bezier(.4,0,1,1) forwards}
@keyframes scrimOut{to{background:transparent}}
@keyframes sheetDown{to{transform:translateY(100%)}}
.msheet{background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100% - var(--top) - 12px);overflow-y:auto;padding:8px 16px calc(20px + var(--sab));animation:sheetUp .42s var(--spring);scrollbar-width:none;box-shadow:0 -10px 40px rgb(0 0 0 / .18)}
.msheet:has(.sheet-cta){padding-bottom:0}
/* acțiunea principală a foii rămâne mereu vizibilă jos, fără derulare */
.sheet-cta{position:sticky;bottom:0;z-index:3;margin:4px -16px 0;padding:12px 16px calc(12px + var(--sab));background:var(--bg);box-shadow:0 -.5px 0 var(--sep),0 -12px 24px -12px rgb(0 0 0 / .12);display:flex;flex-direction:column;gap:8px}
.msheet::-webkit-scrollbar{display:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.handle{width:36px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 10px}
.msheet h3{font:600 20px/1.2 var(--f-display);letter-spacing:-.015em}

/* toast */
/* mesajele apar jos, deasupra barei (sus sunt insula și bara de titlu) */
.toast{position:absolute;z-index:95;left:50%;bottom:calc(var(--sab) + 96px);transform:translateX(-50%);display:flex;align-items:center;gap:9px;width:max-content;max-width:calc(100% - 32px);padding:11px 16px 11px 13px;border-radius:22px;background:color-mix(in srgb,var(--inverse-bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--inverse-text);font-weight:500;font-size:14px;line-height:1.3;box-shadow:var(--shadow-float);animation:toastIn .45s var(--spring)}
.app.tabs-on .toast{bottom:calc(var(--tabbar-h) + 14px)}
.app.tabs-on.has-pill .toast{bottom:calc(var(--tabbar-h) + 74px)}
/* cu o foaie deschisă, mesajul urcă sus, ca să nu acopere glisorul foii */
.app:has(.modal:not(.out)) .toast{bottom:auto;top:calc(var(--top) + 10px)}
.toast.out{animation:toastOut .25s ease-in forwards}
.toast .ic{color:var(--brand);flex:none}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,10px) scale(.96)}}
/* bara de stare: fundal estompat cât derulezi (ca la iOS), ca textul să nu treacă pe sub ceas */
.sbshade{position:absolute;z-index:36;top:0;left:0;right:0;height:var(--top);background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(16px) saturate(1.7);-webkit-backdrop-filter:blur(16px) saturate(1.7);opacity:0;transition:opacity .2s;pointer-events:none}
.sbshade.on{opacity:1}

/* ---------- harta ---------- */
.mapwrap{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--map-land);touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
.mapwrap svg.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.m-land{fill:var(--map-land)}.m-block{fill:var(--map-block)}.m-block2{fill:var(--map-block-2)}.m-park{fill:var(--map-park)}.m-forest{fill:var(--map-forest)}
.m-water{fill:none;stroke:var(--map-water);stroke-linecap:round;stroke-linejoin:round}
.m-lake{fill:var(--map-water)}
.m-case{fill:none;stroke:var(--map-case);stroke-linecap:round;stroke-linejoin:round}
.m-road{fill:none;stroke:var(--map-road);stroke-linecap:round;stroke-linejoin:round}
.m-mcase{fill:none;stroke:var(--map-major-case);stroke-linecap:round;stroke-linejoin:round}
.m-major{fill:none;stroke:var(--map-major);stroke-linecap:round;stroke-linejoin:round}
.m-motcase{fill:none;stroke:var(--map-motor-case);stroke-linecap:round;stroke-linejoin:round}
.m-motor{fill:none;stroke:var(--map-motor);stroke-linecap:round;stroke-linejoin:round}
.m-rail{fill:none;stroke:var(--map-rail);stroke-dasharray:6 5}
.m-label{fill:var(--map-label);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--map-halo);stroke-width:4px;stroke-linejoin:round}
.m-label.town{font-size:16px}
.m-label.city{font-size:22px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.m-label.small{font-size:11.5px;font-weight:500}
.m-label.water{fill:var(--map-water-label);font-style:italic;font-weight:500;font-size:12px}
.m-shield rect{fill:var(--map-shield);stroke:var(--map-major-case);stroke-width:1.2}
.m-shield text{fill:var(--map-shield-ink);font:700 10.5px var(--f-body);text-anchor:middle}
.m-shield.e rect{fill:#2E8B3A;stroke:#fff}
.m-shield.e text{fill:#fff}
.pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;padding:0;background:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 2px 5px rgb(0 0 0 / .22));transition:transform .2s cubic-bezier(.3,.8,.3,1.3);animation:pinIn .45s cubic-bezier(.3,.8,.3,1.3) backwards}
.pin:nth-child(2){animation-delay:.05s}.pin:nth-child(3){animation-delay:.1s}.pin:nth-child(4){animation-delay:.15s}.pin:nth-child(5){animation-delay:.2s}.pin:nth-child(6){animation-delay:.25s}.pin:nth-child(7){animation-delay:.3s}
@keyframes pinIn{from{opacity:0;transform:translate(-50%,-70%) scale(.6)}}
.pin .pb{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 4px;border-radius:14px;background:var(--surface);color:var(--text);font-weight:600;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pin .pb .pi{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:var(--st-free);color:var(--pin-glyph)}
.pin .pb .pi .ic{width:13px;height:13px;stroke-width:2.2}
.pin.busy .pi{background:var(--st-busy)}
.pin.fault .pi,.pin.off .pi,.pin.nosig .pi{background:var(--pin-off)}
.pin.nosig .pb{outline:1.2px dashed var(--st-off)}
.pin.mine .pi{background:var(--brand);color:var(--on-brand);animation:blink 1.4s ease-in-out infinite}
.pin .pt{width:10px;height:6px;background:var(--surface);clip-path:polygon(0 0,100% 0,50% 100%);margin-top:-1px}
.pin .sun{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--solar);color:#3A2A00;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.pin .sun .ic{width:10px;height:10px;stroke-width:2.6}
.pin.truck .pb{border-radius:8px}
.pin.sel{transform:translate(-50%,-100%) scale(1.12);z-index:5}
.pin.sel .pb{background:var(--inverse-bg);color:var(--inverse-text)}
.pin.sel .pt{background:var(--inverse-bg)}
.pin.dim{opacity:.35}
.me{position:absolute;left:0;top:0;width:16px;height:16px;transform:translate(-50%,-50%);pointer-events:none}
.me::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:var(--me-halo);animation:ping 2.4s ease-out infinite}
.me::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--me);box-shadow:0 0 0 3px #fff,0 2px 6px rgb(0 0 0 / .3)}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
.map-top{position:absolute;z-index:10;left:0;right:0;top:calc(var(--top) + 6px);display:flex;flex-direction:column;gap:8px;padding-inline:12px;pointer-events:none}
.map-top>*{pointer-events:auto}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 5px 0 12px;border-radius:13px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.8) blur(16px);-webkit-backdrop-filter:saturate(1.8) blur(16px);box-shadow:var(--shadow-float)}
.search .ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;height:100%;font-size:16px;color:var(--text)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--inverse-bg);color:var(--inverse-text);display:grid;place-items:center;font-weight:600;font-size:13px;border:0;flex:none}
.map-ctrl{position:absolute;z-index:10;right:12px;display:flex;flex-direction:column;gap:6px;transition:bottom .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.map-ctrl .iconbtn{width:40px;height:40px;border-radius:50%}
/* pe telefon: zoom cu două degete sau dublă atingere, fără butoane +/−; legenda e în josul listei */
@media (pointer:coarse){.map-ctrl [data-act="zin"],.map-ctrl [data-act="zout"]{display:none}}
@media (max-width:979.98px){.map-legend{display:none}}
.map-legend{position:absolute;z-index:9;left:12px;font-size:10.5px;font-weight:500;color:var(--map-label);background:color-mix(in srgb,var(--surface) 78%,transparent);padding:2px 7px;border-radius:6px;transition:bottom .3s cubic-bezier(.2,.8,.2,1)}
.homesheet{position:absolute;z-index:30;left:0;right:0;bottom:0;background:var(--bg);border-radius:14px 14px 0 0;box-shadow:var(--shadow-sheet);display:flex;flex-direction:column;transition:height .34s cubic-bezier(.2,.8,.2,1)}
.homesheet .hs-grip{border:0;background:transparent;padding:7px 0 3px;width:100%;cursor:grab;touch-action:none}
.homesheet .hs-body{flex:1;min-height:0;overflow-y:auto;padding:4px 12px calc(var(--tabbar-h) + 34px);scrollbar-width:none;scroll-padding-bottom:calc(var(--tabbar-h) + 34px)}
.homesheet .hs-body::-webkit-scrollbar{display:none}
.nowbar{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;font-size:13px;color:var(--text-2)}
.nowbar.day{background:var(--day-soft)}
.nowbar.night{background:var(--night-soft)}
.nowbar.solar{background:var(--solar-soft)}
.nowbar b{color:var(--text);font-weight:600}
.nowbar .link{font-size:14px}

/* rând de stație */
.srow{display:flex;gap:11px;align-items:flex-start;width:100%;padding:11px 12px;border-radius:12px;border:0;background:var(--surface);text-align:left;color:var(--text)}
.srow:active{background:var(--surface-2)}
.srow.sel{box-shadow:inset 0 0 0 1.5px var(--inverse-bg)}
.srow .sr-ic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink)}
.srow .sr-ic .ic{width:20px;height:20px}
.srow .sr-ic.truck{background:var(--fill);color:var(--text)}
.srow .sr-ic{position:relative}
.srow .sr-ic .sun{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--solar);color:#3A2A00;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.srow .sr-ic .sun .ic{width:11px;height:11px;stroke-width:2.6}
.srow .sr-s .sol{color:var(--day-ink);font-weight:600}
.srow .sr-t{display:block;font-weight:600;font-size:15px;line-height:1.25}
.srow .sr-s{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.srow .sr-m{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.srow .sr-p{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.srow .sr-p b{font:650 16px var(--f-round);font-variant-numeric:tabular-nums}
.srow .sr-p span{font-size:11px;color:var(--muted)}
.selcard{box-shadow:inset 0 0 0 1.5px var(--inverse-bg)}

/* detaliu stație */
.art{position:relative;height:calc(clamp(190px,50vw,280px) + var(--top));overflow:hidden;background:linear-gradient(180deg,var(--sky-1),var(--sky-2))}
.art>svg,.art>canvas{position:absolute;inset:0;width:100%;height:100%}
.art .art-top{position:absolute;z-index:3;left:0;right:0;top:calc(var(--top) + 6px);display:flex;justify-content:space-between;padding-inline:12px}
.art .iconbtn{width:36px;height:36px;border-radius:50%}
.st-head{margin-top:-18px;position:relative;z-index:4;border-radius:16px 16px 0 0;background:var(--bg);padding:14px 16px 4px;display:flex;flex-direction:column;gap:6px}
.st-head .h-screen{font-size:24px}
.conn{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:var(--surface);text-align:left;color:var(--text)}
.conn[aria-checked="true"]{box-shadow:inset 0 0 0 1.5px var(--brand)}
.conn[disabled]{opacity:.55;cursor:not-allowed}
/* punctele stației: o singură listă grupată, cu separatoare fine (mai aerisit decât carduri separate) */
.connlist{background:var(--surface);border-radius:14px;overflow:hidden}
.connlist .conn{position:relative;border-radius:0;background:transparent;padding:11px 14px}
.connlist .conn+.conn::before{content:"";position:absolute;top:0;left:63px;right:0;height:.5px;background:var(--sep)}
.connlist .conn[aria-checked="true"]{box-shadow:none;background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.connlist .conn[aria-checked="true"]::after{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3.5px;border-radius:0 3px 3px 0;background:var(--brand);animation:dotPop .35s var(--spring)}
.connlist .conn[disabled] .c-ic,.connlist .conn[disabled] .grow{opacity:.55}
.connlist .conn[disabled]{opacity:1}
.connlist .conn:active{transform:none;background:var(--fill)}
.conn .c-ic{width:38px;height:38px;border-radius:10px;background:var(--fill);display:grid;place-items:center;flex:none}
.conn .c-ic .ic{width:24px;height:24px;stroke-width:1.5}
.conn .c-kw{font:650 16px var(--f-round);font-variant-numeric:tabular-nums}
.conn .c-sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.conn .c-sub .mono{font-size:11.5px}
.conn .c-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sticky-cta{position:sticky;bottom:0;z-index:15;margin-top:16px;padding:10px 16px calc(10px + max(var(--sab), 8px));background:var(--bg);box-shadow:0 -.5px 0 var(--sep),0 -12px 24px -12px rgb(0 0 0 / .12)}
.pvstats .num{font-size:20px;line-height:1.1}
.pv-sub{font-size:12px;color:var(--muted);margin-top:1px}
.num .unit,.unit{font:500 12px var(--f-body);color:var(--muted)}
.unit-lg{font:600 17px var(--f-body);margin-left:5px}

/* bară 24h */
.dayline{position:relative;height:34px;border-radius:9px;overflow:hidden;display:flex}
.dayline .seg-d{background:var(--day-soft)}
.dayline .seg-n{background:var(--night-soft)}
.dayline .seg-s{background:var(--solar-soft);box-shadow:inset 0 0 0 1.2px color-mix(in srgb,var(--solar) 55%,transparent)}
.dayline .seg-d,.dayline .seg-n,.dayline .seg-s{height:100%}
.dayline .dl-now{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:2px;background:var(--text);transform:translateX(-50%)}
.dayline .dl-lab{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center}
.dl-ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px;font-variant-numeric:tabular-nums}

/* sesiune live */
.live-hero{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 16px}
.ring{position:relative;width:212px;height:212px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rg-track{fill:none;stroke:var(--fill)}
.ring .rg-val{fill:none;stroke:url(#gEnergy);stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring .rg-target{stroke:var(--text);stroke-width:2.5}
.ring .rg-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .kw{display:flex;align-items:baseline;font:700 54px/.95 var(--f-round);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring .kw-dec{font-size:24px;letter-spacing:-.02em;color:var(--muted)}
.ring .kw-u{font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.ring .soc{margin-top:8px;display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.ring .pulse{position:absolute;inset:16px;border-radius:50%;animation:glow 2.2s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 35%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.live-hero .eta{font-weight:500;font-size:14px;margin-top:6px;text-align:center;color:var(--text-2)}
.live-hero .hint{display:flex;align-items:flex-start;gap:7px;text-align:left;font-size:12.5px;color:var(--muted);margin-top:6px;max-width:36ch}
.live-hero .hint:empty{display:none}
.live-hero .hint .ic{margin-top:1px}
.chart{width:100%;height:auto;max-height:190px;display:block;overflow:visible}
.chart .grid{stroke:var(--sep);stroke-width:1}
.chart .axis{fill:var(--faint);font:500 10px var(--f-body)}
.chart .area{fill:url(#gArea)}
.chart .lineP{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--brand);stroke:var(--surface);stroke-width:3}
.chart .cap{stroke:var(--text-2);stroke-dasharray:3 4;stroke-width:1}
.chart .capl{fill:var(--text-2);font:600 10px var(--f-body)}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.mix span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.empty{padding-top:40px;align-items:center;text-align:center}
.done-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.rline{display:flex;align-items:center;gap:11px}
.rline .tile{width:28px;height:28px;border-radius:8px}
.rline .grow{display:flex;flex-direction:column;line-height:1.3}
.rline .grow .muted{font-size:12.5px}
.rline b{font-weight:600}
.pricecard{background:var(--surface)}

/* scanare */
.scan{position:absolute;inset:0;background:#0B0E0B;color:#F2F5EF;display:flex;flex-direction:column}
.scan .sc-view{position:relative;flex:1;display:grid;place-items:center;overflow:hidden;background:radial-gradient(120% 80% at 50% 40%,#252c26 0%,#0b0e0b 70%)}
.scan .sc-head{position:absolute;top:calc(var(--top) + 10px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.scan .sc-btn{background:rgb(255 255 255 / .12);color:#F2F5EF;box-shadow:none}
.scan .sc-btn[aria-pressed="true"]{background:#F2F5EF;color:#111}
.scan .sc-frame{position:relative;width:220px;height:220px}
.scan .sc-frame svg{position:absolute;inset:0;width:100%;height:100%}
.scan .sc-line{position:absolute;left:12px;right:12px;height:2px;border-radius:2px;background:var(--brand);box-shadow:0 0 16px 3px rgb(114 191 68 / .55);animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:14px}50%{top:calc(100% - 16px)}}
.scan .sc-qr{position:absolute;inset:44px;opacity:.14;color:#fff}
.scan .sc-qr .ic{width:100%;height:100%;stroke-width:1}
.scan .sc-tip{position:absolute;bottom:20px;left:24px;right:24px;text-align:center;color:#C9D2C3;font-size:14px}
.scan .sc-torch{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 45%,rgb(255 255 230 / .16),transparent 70%);pointer-events:none}
.scan .sc-bottom{background:#131713;border-radius:16px 16px 0 0;padding:16px 16px calc(var(--tabbar-h) + 30px);display:flex;flex-direction:column;gap:10px}
.scan .eyebrow{color:#A9B3A4}
.scan .input{background:#1D221D;border-color:#3A4439;color:#F2F5EF}
.scan .sc-msg{font-size:12.5px;color:#A9B3A4}
.scan .sc-msg.err{color:#FF9A90!important}
.scan .sc-line-btn{color:#F2F5EF;box-shadow:inset 0 0 0 1px #3A4439;min-width:0;padding:0 10px}

/* carduri RFID fizice */
.rfid{position:relative;width:280px;max-width:calc(100vw - 64px);aspect-ratio:85.6/54;border-radius:14px;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:#231F20;box-shadow:0 8px 24px rgb(0 0 0 / .18);border:0;text-align:left;cursor:pointer}
div.rfid{cursor:default}
.rfid.big{width:100%;max-width:330px}
.rfid.green{background:linear-gradient(135deg,#83CC52 0%,#62AE38 60%,#4E9A2B 100%);color:#10150D}
.rfid.ink{background:linear-gradient(140deg,#2c2829 0%,#1a1718 100%);color:#F4F7F1}
.rfid.white{background:linear-gradient(140deg,#fbfcfa 0%,#e8ede4 100%);color:#231F20;box-shadow:0 8px 24px rgb(0 0 0 / .12),inset 0 0 0 1px #dfe4d9}
.rfid.add{background:var(--fill);color:var(--text);box-shadow:none;justify-content:center;align-items:center;gap:6px;flex-direction:column;font-weight:600}
.rfid .rf-deco{position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;opacity:.18;pointer-events:none}
.rfid.blocked::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgb(0 0 0 / 0) 0 10px,rgb(0 0 0 / .14) 10px 20px);pointer-events:none}
.rfid .rf-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.rfid .rf-brand{display:flex;align-items:center;gap:8px;font:700 13px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.rfid .rf-brand svg{width:24px;height:24px}
.rfid .rf-brand small{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;opacity:.8;margin-top:3px}
.rfid .rf-num{position:relative;z-index:1;font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.06em}
.rfid .rf-foot{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.rfid .rf-foot b{display:block;font-size:12.5px;letter-spacing:.01em;text-transform:none;opacity:1}
.rfid .rf-nfc{opacity:.85}
.rfid .rf-status{position:relative;z-index:2;display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;background:#FFFFFF;color:#231F20}
.rfid .rf-status.bad{color:#B3261E}
.rfid.white .rf-status{background:#231F20;color:#FFFFFF}
.rfid.white .rf-status.bad{background:#FBE3E0;color:#A8322A}

/* flotă */
.veh{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px;border:0;background:transparent;text-align:left;color:var(--text)}
.veh+.veh::before{left:64px}
.veh .v-ic{width:40px;height:40px;border-radius:11px;background:var(--fill);display:grid;place-items:center;flex:none;overflow:hidden}
.veh .v-ic.live{background:var(--brand);color:var(--on-brand)}
.veh .v-ic.pic{width:64px;height:40px;background:var(--surface-2)}
.veh .v-ic img{width:100%;height:100%;object-fit:contain}
.veh b{font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .8s ease}
.bar.low>i{background:var(--st-busy)}
.plate{display:inline-flex;align-items:center;height:18px;border-radius:4px;border:1px solid var(--text-2);font:600 10.5px var(--f-mono);padding:0 5px 0 0;overflow:hidden;letter-spacing:.03em;color:var(--text)}
.plate::before{content:"RO";display:grid;place-items:center;height:100%;padding:0 3px;margin-right:5px;background:#2F4FB8;color:#fff;font-size:7.5px}
.plate-lg{height:22px;font-size:12px}
.kwcol{width:50px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.soccol{width:60px;text-align:right;flex:none}
.valcol{width:92px;text-align:right;flex:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b .stk{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;gap:2px}
.bars .b .stk i{display:block;width:100%}
.bars .b span{font-size:11px;color:var(--muted)}
.bars .b.cur span{color:var(--text);font-weight:600}

/* dial tarif 24h */
.dial{position:relative;width:220px;height:220px;margin-inline:auto}
.dial svg{width:100%;height:100%}
.dial .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 56px;line-height:1.2;gap:2px}
.dial-t{fill:var(--muted);font:600 11px var(--f-body)}
.pcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}

/* cont */
.prof{display:flex;align-items:center;gap:13px}
.prof .pa{width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 20px var(--f-round);flex:none}
.eyebrow.grp{padding-left:4px}
.eyebrow.day-h{padding:12px 4px 6px}
.foot-logo{display:flex;justify-content:center;padding-block:6px 10px}
.foot-logo img{height:22px;width:auto}
.lk-l{display:var(--lk-l)}.lk-d{display:var(--lk-d)}
.step{gap:12px;padding:9px 0}
.stepdot{width:26px;height:26px;border-radius:50%;font-size:12px}
.stepdot.on{background:var(--t-green);color:#fff}
.qty{font-size:22px;min-width:36px;text-align:center}
.plan{position:relative}
.plan-blk{position:absolute;top:7px;height:20px;background:var(--brand);border-radius:5px;box-shadow:0 0 0 2px var(--surface)}
.plan-dep{position:absolute;top:-4px;height:42px;width:2px;background:var(--st-fault)}
.faq{display:block;min-height:0;padding-block:13px}
.faq summary{font-weight:400;font-size:15.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq[open] summary .ic{transform:rotate(180deg)}
.faq p{margin-top:8px;font-size:14px}
.about{align-items:center;text-align:center}
.about-icon{width:88px;height:88px;border-radius:22px;background:var(--brand);display:grid;place-items:center;margin-top:12px}
.onb{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.onb-top{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:calc(var(--top) + 30px) 24px 10px;position:relative}
.onb-deco{position:absolute;right:-90px;top:40px;width:320px;height:320px;opacity:.07;color:var(--text);pointer-events:none}
.onb-icon{width:76px;height:76px;border-radius:20px;background:var(--brand);display:grid;place-items:center;box-shadow:0 12px 32px rgb(80 150 40 / .3)}
.onb-top .h-screen{font-size:36px!important;line-height:1.02!important}
.onb-bottom{padding:12px 20px calc(20px + var(--sab));display:flex;flex-direction:column;gap:8px}
.star-b{color:var(--solar)}

/* sistem de design */
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sw-c{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);min-width:0}
.sw-c i{display:block;height:40px;border-radius:10px;box-shadow:inset 0 0 0 .5px rgb(0 0 0 / .12)}
.sw-c code{font-family:var(--f-mono);font-size:10px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis}
.icgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.icgrid div{aspect-ratio:1;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--text)}
.rail-r .icgrid div{background:rgb(127 140 118 / .14);color:var(--stage-ink)}
.rail-r .sw-c{color:var(--stage-ink)}
.rail-r .sw-c code{color:var(--stage-ink);opacity:.8}
.type-spec{display:flex;flex-direction:column;gap:6px}

/* instalare pe iPhone */
.a2hs{position:absolute;z-index:70;left:10px;right:10px;top:calc(var(--top) + 60px);display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-float);font-size:13.5px;animation:fadeIn .3s ease-out}
.a2hs b{font-weight:600}
.a2hs .ic{flex:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
.sec-head.pad{padding-inline:20px}
.kv3.pvstats{background:none;border-radius:0;overflow:visible;gap:8px}

/* ---------- scena 3D a sesiunii ---------- */
.stage3d{position:relative;height:min(46vh,330px);margin:0 0 4px;overflow:hidden;background:radial-gradient(90% 70% at 50% 60%,var(--stage3d-2) 0%,var(--stage3d-1) 100%)}
.stage3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity .6s ease}
.stage3d.ready canvas{opacity:1}
.stage3d .s3-fallback{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);transition:opacity .4s}
.stage3d.ready .s3-fallback{opacity:0}
.stage3d .s3-fallback .ic{width:72px;height:72px;stroke-width:1.2;opacity:.5}
.s3-energy{position:absolute;inset:0;display:grid;place-items:center}
.s3-energy i{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:s3ring 2.4s ease-out infinite}
.s3-energy i:nth-child(2){animation-delay:.8s}.s3-energy i:nth-child(3){animation-delay:1.6s}
@keyframes s3ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.2);opacity:0}}
.stage3d.ready .s3-energy{display:none}
.stage3d .s3-top{position:absolute;z-index:2;left:12px;top:10px;display:flex;gap:6px}
.stage3d .s3-drag{position:absolute;z-index:2;right:12px;bottom:10px;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);padding:3px 8px;border-radius:10px;opacity:0;transition:opacity .4s}
.stage3d.ready .s3-drag{opacity:1;animation:hintOut 1s ease 4s forwards}
@keyframes hintOut{to{opacity:0}}
.live-read{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 16px 8px}
.live-read .kw{display:flex;align-items:baseline;font:700 50px/.95 var(--f-round);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.live-read .kw-dec{font-size:22px;color:var(--muted)}
.live-read .kw-u{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.live-read .lr-soc{text-align:right}
.live-read .lr-soc .num{font-size:30px;line-height:1;color:var(--brand-ink)}
.socbar{position:relative;height:10px;margin:0 16px;border-radius:5px;background:var(--fill);overflow:visible}
.socbar i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,var(--brand),var(--volt));overflow:hidden;transition:width .8s ease}
.socbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .55),transparent);width:40%;animation:socShine 1.8s linear infinite}
@keyframes socShine{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.socbar b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text)}
.eta{font-weight:500;font-size:13.5px;margin:10px 16px 0;color:var(--text-2)}
p.hint{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--muted);margin-top:4px}
p.hint:empty{display:none}
.v3d{position:relative;height:230px;border-radius:14px;overflow:hidden;background:radial-gradient(90% 70% at 50% 60%,var(--stage3d-2) 0%,var(--stage3d-1) 100%)}
.v3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity .6s}
.v3d.ready canvas{opacity:1}
/* ecran de pornire: logo care „se încarcă” */
.boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);transition:opacity .45s ease,visibility .45s}
.boot.out{opacity:0;visibility:hidden}
.boot .bm{width:92px;height:92px;position:relative}
.boot .bm svg{width:100%;height:100%}
.boot .bm .fillhouse{animation:houseFill 1.1s cubic-bezier(.5,0,.2,1) forwards}
@keyframes houseFill{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.boot .bt{margin-top:14px;font:600 15px var(--f-display);letter-spacing:-.01em;color:var(--text);text-align:center}
.boot .bb{margin:10px auto 0;width:120px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.boot .bb i{display:block;height:100%;width:0;background:var(--brand);animation:bootBar 1.1s ease forwards}
@keyframes bootBar{to{width:100%}}
.onb-3d{position:relative;height:200px;margin:-10px -24px 0;display:grid;place-items:center start;padding-left:24px}
.onb-3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity .8s}
.onb-3d.ready canvas{opacity:1}
.onb-3d.ready .onb-icon{position:absolute;left:24px;top:0;width:52px;height:52px;border-radius:14px;box-shadow:none}
.onb-3d.ready .onb-icon>div{width:36px!important}
.veh .v-ic.live-ring{box-shadow:inset 0 0 0 2px var(--brand)}

/* ---------- „Insula dinamică” în aplicație ----------
   Capsula neagră se lipește de insula fizică a iPhone-ului (sau de insula ramei pe desktop):
   negru pe negru, deci pare că insula însăși se lărgește și arată încărcarea. */
.dyn{--dyn-top:11px;--dyn-w:124px;--dyn-h:36px;position:absolute;z-index:66;left:50%;top:var(--dyn-top);transform:translateX(-50%);width:var(--dyn-w);height:var(--dyn-h);border-radius:calc(var(--dyn-h) / 2);background:#000;color:#fff;overflow:hidden;transition:width .55s cubic-bezier(.32,1.35,.5,1),height .55s cubic-bezier(.32,1.25,.5,1),border-radius .55s cubic-bezier(.32,1.2,.5,1),box-shadow .6s ease;font-family:var(--f-body);-webkit-user-select:none;user-select:none}
.dyn.compact{width:calc(var(--dyn-w) + 76px)}
.dyn.expanded{width:min(374px,calc(100% - 14px));height:176px;border-radius:46px}
.dyn.pulse{animation:dynGlow 1.6s ease-out}
@keyframes dynGlow{0%{box-shadow:0 0 0 0 rgb(114 191 68 / .75)}60%{box-shadow:0 0 0 14px rgb(114 191 68 / 0)}100%{box-shadow:0 0 0 0 rgb(114 191 68 / 0)}}
.dyn-c{position:absolute;inset:0;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 9px;cursor:pointer;transition:opacity .25s}
.dyn.expanded .dyn-c{opacity:0;pointer-events:none}
.dyn-l,.dyn-r{display:flex;align-items:center;gap:4px;font:600 13px var(--f-round);font-variant-numeric:tabular-nums;white-space:nowrap}
.dyn-l .ic{color:#8BE04E;animation:dynBolt 1.1s ease-in-out infinite}
@keyframes dynBolt{50%{opacity:.35;transform:scale(.88)}}
.dyn-r{color:#8BE04E;font-size:12.5px;letter-spacing:-.02em}
/* compact: inel de baterie cu fulger la stânga camerei, procentul la dreapta (încap lângă ceas) */
.dyn-l .mini{position:relative;width:21px;height:21px;display:grid;place-items:center}
.dyn-l .mini svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dyn-l .mini circle{fill:none;stroke-width:2.6}
.dyn-l .mini .ic{width:11px;height:11px;position:relative}
.dyn.done .dyn-l .ic,.dyn.done .dyn-r{color:#6FA8FF}
.dyn.fee .dyn-l .ic,.dyn.fee .dyn-r{color:#FFB547}
/* extins: rândul de sus stă de o parte și de alta a camerei; restul, sub ea */
.dyn-x{position:absolute;inset:0;padding:12px 20px 16px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:40px auto 1fr;gap:6px 12px;opacity:0;pointer-events:none;transition:opacity .25s .12s}
.dyn.expanded .dyn-x{opacity:1;pointer-events:auto}
.dyn-x .dx-pic{position:relative;grid-row:1;grid-column:1;width:58px;height:38px;border-radius:12px;background:#141814;display:grid;place-items:center;overflow:hidden}
.dyn-x .dx-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#141814}
.dyn-x .dx-pic .ic{width:22px;height:22px;color:#8BE04E}
.dyn-x .dx-soc{grid-row:1;grid-column:3;text-align:right;align-self:center;line-height:1}
.dyn-x .dx-soc b{display:block;font:700 24px/1 var(--f-round);color:#8BE04E;font-variant-numeric:tabular-nums}
.dyn-x .dx-soc span{font-size:11px;color:#A7B0A2}
.dyn-x .dx-mid{grid-row:2;grid-column:1 / 4;display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.dyn-x .dx-kw{font:700 30px/1 var(--f-round);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dyn-x .dx-kw small{font:600 13px var(--f-body);color:#A7B0A2;margin-left:3px}
.dyn-x .dx-t{font-size:12px;color:#A7B0A2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;min-width:0}
.dyn-x .dx-bar{grid-row:3;grid-column:1 / 4;align-self:end;display:flex;flex-direction:column;gap:8px}
.dyn-x .dx-track{height:7px;border-radius:4px;background:#262B26;overflow:hidden;position:relative}
.dyn-x .dx-track i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,#72BF44,#D4F36B);transition:width .8s ease}
.dyn-x .dx-track i::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .6),transparent);animation:socShine 1.6s linear infinite}
.dyn-x .dx-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:#A7B0A2}
.dyn-x .dx-row>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dyn-x .dx-row button{flex:none;border:0;height:30px;padding:0 14px;border-radius:15px;background:#72BF44;color:#10140F;font:600 12.5px var(--f-body);transition:transform .3s var(--spring)}
.dyn-x .dx-row button:active{transform:scale(.9);transition-duration:.08s}
.dyn.done .dx-soc b{color:#6FA8FF}.dyn.fee .dx-soc b{color:#FFB547}
@media (prefers-reduced-motion:reduce){.dyn{transition:none}.dyn-l .ic{animation:none}}

</style>

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function smooth(pts, closed = false) {
  const P = closed ? [pts[pts.length - 1], ...pts, pts[0], pts[1]] : [pts[0], ...pts, pts[pts.length - 1]];
  let d = `M${P[1][0].toFixed(1)},${P[1][1].toFixed(1)}`;
  for (let i = 1; i < P.length - 2; i++) {
    const [p0, p1, p2, p3] = [P[i - 1], P[i], P[i + 1], P[i + 2]];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return closed ? d + 'Z' : d;
}
function blob(x, y, r, R, n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, rr = r * (0.72 + R() * 0.5);
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.86]);
  }
  return smooth(pts, true);
}
function townBlocks(t, R, idx) {
  const n = Math.ceil(t.r / t.cell) + 1;
  let s = `<g transform="translate(${t.x} ${t.y}) rotate(${t.rot})">`;
  for (let gx = -n; gx <= n; gx++) for (let gy = -n; gy <= n; gy++) {
    const cx = gx * t.cell, cy = gy * t.cell, d = Math.hypot(cx, cy);
    if (d > t.r * (0.7 + R() * 0.35)) continue;
    if (R() < 0.16) continue;
    if (gx % 4 === 0 || gy % 5 === 0) continue; /* străzi */
    const w = t.cell - 6 - R() * 5, h = t.cell - 6 - R() * 5;
    const cls = R() < 0.3 ? 'm-block2' : 'm-block';
    s += `<rect class="${cls}" x="${(cx - w / 2).toFixed(1)}" y="${(cy - h / 2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2.5"/>`;
  }
  /* străzi locale */
  for (let k = -n; k <= n; k++) {
    if (k % 4 === 0) { const L = Math.sqrt(Math.max(0, t.r * t.r - (k * t.cell) ** 2)); if (L > 8) s += `<line class="m-road" stroke-width="4" x1="${k * t.cell}" y1="${-L}" x2="${k * t.cell}" y2="${L}"/>`; }
    if (k % 5 === 0) { const L = Math.sqrt(Math.max(0, t.r * t.r - (k * t.cell) ** 2)); if (L > 8) s += `<line class="m-road" stroke-width="4" x1="${-L}" y1="${k * t.cell}" x2="${L}" y2="${k * t.cell}"/>`; }
  }
  return s + '</g>';
}
function buildWorld() {
  const { W, H } = MAP, R = rng(20260925);
  const roadSet = (list, caseCls, fillCls, cw, fw) =>
    list.map(r => `<path class="${caseCls}" stroke-width="${cw}" d="${smooth(r.pts)}"/>`).join('') +
    list.map(r => `<path class="${fillCls}" stroke-width="${fw}" d="${smooth(r.pts)}"/>`).join('');
  let s = `<svg class="world" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;
  s += `<rect class="m-land" width="${W}" height="${H}"/>`;
  MAP.forests.forEach(f => { s += `<path class="m-forest" d="${blob(f.x, f.y, f.r, R, f.n)}"/>`; });
  MAP.towns.forEach((t, i) => { s += townBlocks(t, R, i); });
  MAP.parks.forEach(p => { s += `<path class="m-park" d="${blob(p.x, p.y, p.r, R, p.n)}"/>`; });
  s += `<path class="m-water" stroke="var(--map-water-edge)" stroke-width="19" d="${smooth(MAP.river)}"/>`;
  s += `<path class="m-water" stroke-width="15" d="${smooth(MAP.river)}"/>`;
  s += `<path class="m-lake" d="${blob(430, 470, 26, R, 7)}"/>`;
  s += `<path class="m-rail" stroke-width="2.4" d="${smooth(MAP.rail)}"/>`;
  s += roadSet(MAP.roads.minor, 'm-case', 'm-road', 9, 6);
  s += roadSet(MAP.roads.major, 'm-mcase', 'm-major', 14, 10);
  s += roadSet(MAP.roads.motor, 'm-motcase', 'm-motor', 18, 13);
  const a = MAP.airport;
  s += `<g transform="translate(${a.x} ${a.y}) rotate(${a.rot})"><rect class="m-block2" x="-110" y="-16" width="220" height="32" rx="6"/><rect class="m-road" x="-100" y="-5" width="200" height="10" rx="5" style="fill:var(--map-road)"/></g>`;
  s += `<text class="m-label small" x="${a.x}" y="${a.y + 44}" text-anchor="middle">Aeroportul Ștefan cel Mare</text>`;
  s += `<text class="m-label water" transform="translate(${MAP.riverLabel.x} ${MAP.riverLabel.y}) rotate(${MAP.riverLabel.rot})">${MAP.riverLabel.t}</text>`;
  const shields = [...MAP.roads.motor, ...MAP.roads.major].filter(r => r.shield);
  shields.forEach(r => {
    const w = r.shield.length > 3 ? 42 : 36;
    s += `<g class="m-shield${r.e ? ' e' : ''}" transform="translate(${r.sx} ${r.sy})"><rect x="${-w / 2}" y="-10" width="${w}" height="20" rx="5"/><text y="4">${r.shield}</text></g>`;
  });
  MAP.roads.major.filter(r => r.label).forEach(r => { s += `<text class="m-label small" x="${r.sx}" y="${r.sy}" text-anchor="middle" transform="rotate(38 ${r.sx} ${r.sy})">${r.label}</text>`; });
  MAP.towns.forEach(t => {
    const cls = t.kind === 'city' ? 'city' : t.kind === 'town' ? 'town' : 'small';
    s += `<text class="m-label ${cls}" x="${t.lx}" y="${t.ly}" text-anchor="middle">${t.name}</text>`;
  });
  return s + '</svg>';
}

function bindSlider(root, id, onDone) {
  const el = root.querySelector('#' + id); if (!el) return;
  const knob = el.querySelector('.sl-knob'), fill = el.querySelector('.sl-fill');
  let x0 = 0, dx = 0, drag = false, fired = false;
  const max = () => el.clientWidth - knob.offsetWidth - 8;
  const set = v => { knob.style.transform = `translateX(${v}px)`; fill.style.width = (v + 64) + 'px'; };
  const finish = () => { if (fired) return; fired = true; el.classList.add('done'); set(max()); setTimeout(onDone, 160); };
  knob.addEventListener('pointerdown', e => { drag = true; x0 = e.clientX; knob.setPointerCapture(e.pointerId); knob.style.transition = 'none'; fill.style.transition = 'none'; });
  knob.addEventListener('pointermove', e => { if (!drag) return; dx = Math.max(0, Math.min(max(), e.clientX - x0)); set(dx); });
  const up = () => { if (!drag) return; drag = false; knob.style.transition = 'transform .25s'; fill.style.transition = 'width .25s'; if (dx > max() * 0.82) finish(); else set(0); dx = 0; };
  knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
  knob.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish(); } });
}

const FILTERS = [['toate', 'Toate', null], ['auto', 'Mașini și dube', 'car'], ['camioane', 'Camioane', 'truck'], ['p150', '150' + NB + 'kW+', 'bolt'], ['solar', 'Solar acum', 'sun'], ['liber', 'Doar libere', 'check']];
function passFilter(st) {
  const f = S.filter, q = S.query.trim().toLowerCase();
  if (q && !(st.name + ' ' + st.city + ' ' + st.addr + ' ' + st.conns.map(c => c.evse).join(' ')).toLowerCase().includes(q)) return false;
  if (f === 'auto') return st.conns.some(c => !isTruckCls(c.cls));
  if (f === 'camioane') return isTruckSt(st);
  if (f === 'p150') return st.conns.some(c => c.kw >= 150);
  if (f === 'solar') return solarOn(st);
  if (f === 'liber') return freeCount(st) > 0;
  return true;
}

function connRow(k, sel) {
  const mineRes = k.status === 'myres', dis = !isFreeFor(k);
  const extra = [k.bay ? 'loc ' + k.bay : '', k.shared ? 'putere partajată' : '', k.resWin && !mineRes ? 'rezervat ' + k.resWin : '', k.note || '', k.status === 'nosig' ? `fără date de ${k.lastSeen || st0LastSeen(k)}${NB}min` : ''].filter(Boolean);
  const badge = mineRes ? stBadge('myres', `Rezervat pentru tine · ${S.myRes && S.myRes.label}`) : stBadge(k.status);
  return `<button class="conn" data-act="pickConn" data-id="${k.id}" role="radio" aria-checked="${k.id === sel}" ${dis ? 'disabled' : ''}>
    <span class="c-ic">${ic(PLUG[k.type][0])}</span>
    <span class="grow"><span class="hrow" style="gap:8px;flex-wrap:wrap"><span class="c-kw">${kwLabel(k.kw)}</span><span style="font-weight:750">${PLUG[k.type][1]}</span>${isTruckCls(k.cls) ? `<span class="tag tag-xs">${ic('truck', 's16')}Doar camioane</span>` : ''}</span><span class="c-sub"><span class="mono">${k.evse}</span>${extra.map(x => ' · ' + x).join('')}</span></span>
    <span class="c-right">${badge}<span class="tnum" style="font-size:13px;font-weight:750">${priceStr(k.cls, price(k.cls))}</span></span></button>`;
}
const st0LastSeen = () => 12;
/* primul punct liber potrivit pentru vehiculele contului (fără capcana „doar camioane” pentru mașini) */
function bestConn(st, want) {
  const vs = myVehicles();
  const ok = c => isFreeFor(c) && vs.some(v => fitsConn(v, c));
  if (want) { const w = conn(st, want); if (w && ok(w)) return w.id; }
  const mr = st.conns.find(c => c.status === 'myres'); if (mr && ok(mr)) return mr.id;
  const f = st.conns.find(ok) || st.conns.find(isFreeFor);
  return f ? f.id : null;
}
function stationIdleNote(st) {
  const cl = stClasses(st), parts = [];
  if (cl.includes('ac')) parts.push('Pe AC nu există taxă de ocupare.');
  const car = cl.find(k => idleCfg(k) && !isTruckCls(k)); if (car) parts.push(`La DC: ${idleRule(car).charAt(0).toLowerCase() + idleRule(car).slice(1)}`);
  const tr = cl.find(k => isTruckCls(k)); if (tr) parts.push(`La camioane: ${idleRule(tr).charAt(0).toLowerCase() + idleRule(tr).slice(1)}`);
  return parts.join(' ');
}

function histCost(x) { if (x.cost != null) return x.cost; const cl = x.cls || 'dc'; return x.zi * price(cl, 'zi') + x.noapte * price(cl, 'noapte') + (x.solar || 0) * price(cl, 'solar'); }

    const tot3 = w => Math.max(w.zi + w.noapte + w.solar, 0.001), mx = Math.max(...weeks.map(tot3), 1);

    const items = h.map(x => {

      <section class="sec"><div class="card p stack"><div class="stack" style="gap:6px"><h3 class="h-sec" style="font-size:17px">kWh pe săptămână</h3><div class="legend"><span><i style="background:var(--day)"></i>Zi</span><span><i style="background:var(--solar)"></i>Ora solară</span><span><i style="background:var(--night)"></i>Noapte</span></div></div>
        <div class="bars">${weeks.map((w, i) => `<div class="b${i === 3 ? ' cur' : ''}"><span class="tnum" style="font-size:10.5px">${nf(tot3(w), 0)}</span><div class="stk" style="height:${Math.max(4, tot3(w) / mx * 100)}px"><i style="height:${w.zi / tot3(w) * 100}%;background:var(--day)"></i><i style="height:${w.solar / tot3(w) * 100}%;background:var(--solar)"></i><i style="height:${w.noapte / tot3(w) * 100}%;background:var(--night)"></i></div><span>${w.l}</span></div>`).join('')}</div></div></section>

  return { t: DATA.fleet.status[v.id] || 'Parcat', live: false, soc: v.soc };
}

function planStart(mode, now = new Date()) {
  const d = new Date(now);
  if (mode === 'rapid') return d;
  if (mode === 'solar') { const h = d.getHours() + d.getMinutes() / 60; if (h >= T.solarHour.from && h < T.solarHour.to) return d; if (h >= T.solarHour.to) d.setDate(d.getDate() + 1); d.setHours(T.solarHour.from, 0, 0, 0); return d; }
  if (band(d) === 'noapte') return d;
  d.setHours(T.nightStart, 0, 0, 0); return d;
}

}
