  if (k === 'sesiune') { if (!S.session) { S.session = seedSession(); store.set('noSeed', false); } return replaceTo([{ r: 'harta', p: {} }, { r: 'sesiune', p: {} }], 'harta'); }
  if (k === 'rezumatDemo') {
    if (!S.lastSummary) { const s = newSession({ st: 'itcani', conn: 'i1', veh: 'model-y', pay: 'pay-firma', target: 80 }); s.soc = s.soc0 = 10; s.start = Date.now() - 25 * 60 * 1000; stepSession(s, 25 * 60); const fee = 0, lines = {}; ['zi', 'solar', 'noapte'].forEach(b => { if (s.kb[b] > 0.005) lines[b] = round2(s.cb[b]); }); S.lastSummary = { ...s, fee, lines, total: round2(Object.values(lines).reduce((a, x) => a + x, 0)), chargeMin: s.t / 60, idleMin: 0, end: new Date() }; }
    return replaceTo([{ r: 'activitate', p: {} }, { r: 'rezumat', p: {} }], 'activitate');
  }
  if (k === 'vehiculTir') { if (S.account !== 'firma') { S.account = 'firma'; store.set('account', 'firma'); } return replaceTo([{ r: 'flota', p: {} }, { r: 'vehicul', p: { id: 'etgx' } }], 'flota'); }
  if (k === 'cardDemo') return replaceTo([{ r: 'cont', p: {} }, { r: 'card', p: { id: S.account === 'firma' ? 'c19' : 'c21' } }], 'cont');
  replaceTo([{ r: 'cont', p: {} }, { r: k, p: {} }], 'cont');
}
function currentRailKey() {
  const top = curTop();
  if (top.r === 'statie') return top.p.id === 'tir' ? 'statieTir' : 'statie';
  return { vehicul: 'vehiculTir', rezumat: 'rezumatDemo', card: 'cardDemo' }[top.r] || top.r;
}
function renderRail() {
  const L = $('#railL'); if (!L || getComputedStyle(L).display === 'none') return;
  const cur = currentRailKey();
  L.innerHTML = `<div class="rail-logo"><img class="lk-l" src="${LOGO.light}" alt="Termohabitat Fotovoltaice"><img class="lk-d" src="${LOGO.dark}" alt="Termohabitat Fotovoltaice"></div>
    <div class="stack" style="gap:8px"><h1>Termohabitat Charge</h1><p class="rail-sub">Prototip web al aplicației de încărcare pentru mașini, dube, camioane și flote. Stațiile sunt alimentate de centralele fotovoltaice Termohabitat.</p></div>
    <nav class="rail-group" aria-label="Ecrane"><span class="eyebrow">Ecrane</span><div class="rail-list">${RAIL_SCREENS.map(([k, l, i]) => `<button data-rail="${k}" aria-current="${k === cur}">${ic(i)}${l}</button>`).join('')}</div></nav>
    <div class="rail-group"><span class="eyebrow">Aspect</span>${segc('rtheme', [['sistem', 'Automat'], ['luminos', 'Luminos'], ['intunecat', 'Întunecat']], S.theme, 'Aspect')}</div>
    <div class="rail-group"><span class="eyebrow">Cont</span>${segc('racct', [['personal', 'Personal'], ['firma', 'Firmă']], S.account, 'Cont')}</div>
    <div class="rail-group"><span class="eyebrow">Viteză simulare</span>${segc('rspeed', [['1', '×1'], ['10', '×10'], ['60', '×60']], String(S.speed), 'Viteză simulare')}</div>
    <p class="rail-note">Date exemplu. Harta e ilustrativă. Pe telefon, aplicația ocupă tot ecranul.</p>`;
  const Rr = $('#railR');
  if (Rr && getComputedStyle(Rr).display !== 'none' && !Rr.dataset.done) { Rr.dataset.done = '1'; Rr.innerHTML = `<div class="stack" style="gap:6px"><span class="eyebrow">Sistem de design</span><h1 style="font-size:22px">Lime + Bolt, pentru flote</h1><p class="rail-sub">Un buton mare de scanare, glisare pentru pornire și oprire, hartă cu foaie de jos, cifre mari pentru kW. Verdele și cerneala vin din logo.</p></div>${designBody(true)}`; }
}

/* ---------- pornire ---------- */
function boot() {
  applyTheme();
  $('#tabbar').innerHTML = [['harta', 'Hartă', 'map'], ['activitate', 'Activitate', 'activity']].map(([k, l, i]) => `<button class="tab" data-tab="${k}">${ic(i)}<span>${l}</span></button>`).join('')
    + `<button class="tab-scan" data-tab="scan" aria-label="Scanează și încarcă"><span class="fab">${ic('qr')}</span><span class="lbl">Scanează</span></button>`
    + [['flota', 'Flotă', 'fleet'], ['cont', 'Cont', 'user']].map(([k, l, i]) => `<button class="tab" data-tab="${k}">${ic(i)}<span>${l}</span></button>`).join('');
  $('#livepill').addEventListener('click', () => go('sesiune'));
  const sh = document.createElement('div'); sh.className = 'sbshade'; sh.id = 'sbshade'; sh.setAttribute('aria-hidden', 'true'); $('#app').appendChild(sh);
  view().addEventListener('scroll', e => { if (e.target === curScr()) shadeUpdate(); }, { capture: true, passive: true });
  /* pe iPhone, :active (animația de apăsare) cere un ascultător touchstart; ciupitul nu mărește toată aplicația */
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('gesturestart', e => e.preventDefault());
  /* undă de la locul atingerii pe butoanele mari */
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('.btn,.opt,.conn,.srow,.dx-row button'); if (!b || b.disabled) return;
    const r = b.getBoundingClientRect(), d = Math.hypot(r.width, r.height) * 2, f = document.createElement('span');
    f.className = 'tapfx'; f.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;width:${d}px;height:${d}px`;
    if (getComputedStyle(b).position === 'static') b.style.position = 'relative';
    b.style.overflow = 'hidden'; b.appendChild(f); setTimeout(() => f.remove(), 600);
  }, { passive: true });
  const h = (location.hash || '').slice(1);
  render('fade');
  if (h && RAIL_SCREENS.some(r => r[0] === h)) railGo(h);
  statusClock(); setInterval(statusClock, 10000); setInterval(tick, 1000);
  /* ecranul de pornire (doar în aplicația instalabilă) */
  const bootEl = $('#boot'); if (bootEl) setTimeout(() => { bootEl.classList.add('out'); setTimeout(() => bootEl.remove(), 500); }, 1150);
  /* pe iPhone, în Safari: arată cum se instalează aplicația pe ecranul principal */
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (document.documentElement.classList.contains('pwa') && ios && !navigator.standalone && !store.get('a2hs', false)) setTimeout(() => {
    const b = document.createElement('div'); b.className = 'a2hs'; b.setAttribute('role', 'status');
    b.innerHTML = `<span class="tile brand">${ic('download', 's18')}</span><span class="grow"><b>Instalează aplicația</b><br>Apasă ${ic('share', 's16')} <b>Distribuie</b> în Safari, apoi <b>Adaugă pe ecranul principal</b>.</span><button class="iconbtn flat" aria-label="Închide">${ic('x', 's18')}</button>`;
    b.querySelector('button').addEventListener('click', () => { store.set('a2hs', true); b.remove(); });
    $('#app').appendChild(b);
  }, 1800);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderRail(); const el = curScr(); if (MAPCTL.setSheet && el && el.dataset.route === 'harta') MAPCTL.setSheet(S.sheet, false); }, 120); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* ============================================================
   06 · „Insula dinamică” în aplicație
   O aplicație web nu poate scrie în Dynamic Island când e în fundal (acolo apar doar
   Live Activities ale aplicațiilor native). Cât aplicația e deschisă, desenăm o capsulă
   neagră lipită de insula fizică: negru pe negru, deci pare că insula se lărgește.
   ============================================================ */
const ISL = { state: 'hidden', timer: 0, lastDone: false, forced: /(^|[?&#])insula\b/.test(location.search + location.hash) };
/* geometria insulei: rama de pe desktop sau iPhone-ul real (zona sigură de sus ≥ 50 pt = are Dynamic Island) */
function islandGeom() {
  const dev = $('.device'), frame = window.innerWidth >= 980;
  if (frame) return { top: 11, w: 122, h: 35 };
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const sat = topInset();
  if ((standalone || ISL.forced) && sat >= 50) return { top: Math.max(8, sat / 2 - 18.5), w: 126, h: 37 };
  if (ISL.forced) return { top: 11, w: 126, h: 37 };
  return null;
}
function islandSet(state, hold) {
  const d = $('#dyn'); if (!d) return;
  clearTimeout(ISL.timer);
  ISL.state = state;
  d.classList.toggle('compact', state === 'compact');
  d.classList.toggle('expanded', state === 'expanded');
  if (state === 'expanded' && hold) ISL.timer = setTimeout(() => islandSet('compact'), hold);
}
function islandPulse() { const d = $('#dyn'); if (!d) return; d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse'); }
function islandRender() {
  const d = $('#dyn'); if (!d) return;
  const s = S.session, top = curTop(), g = islandGeom();
  const route = top && top.r; if (route !== ISL.route) { ISL.prevRoute = ISL.route; ISL.route = route; }
  const show = !!s && !!g && top && top.r !== 'sesiune';
  if (!show) { if (!d.hidden) { islandSet('hidden'); d.hidden = true; } return; }
  if (d.hidden) {
    d.hidden = false; d.style.setProperty('--dyn-top', g.top + 'px'); d.style.setProperty('--dyn-w', g.w + 'px'); d.style.setProperty('--dyn-h', g.h + 'px');
    /* ieșirea din ecranul de încărcare „intră” în insulă: se lărgește cu un puls, fără să acopere ecranul */
    const fromSession = ISL.prevRoute === 'sesiune';
    requestAnimationFrame(() => { islandSet('compact'); if (fromSession) islandPulse(); });
  }
  const v = vehicle(s.veh), st = station(s.st), fee = s.done && idleLeft(s) <= 0;
  d.classList.toggle('done', s.done && !fee); d.classList.toggle('fee', fee);
  const soc = Math.floor(s.soc), C = 2 * Math.PI * 7.4;
  const col = fee ? '#FFB547' : s.done ? '#6FA8FF' : '#8BE04E';
  const L = d.querySelector('.dyn-l'), Rr = d.querySelector('.dyn-r'), icon = s.done ? 'checkCircle' : 'boltF';
  if (L.dataset.ic !== icon) { L.dataset.ic = icon; L.innerHTML = `<span class="mini"><svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.4" stroke="#2A302A"/><circle class="mv" cx="9" cy="9" r="7.4" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" style="transition:stroke-dashoffset .8s ease"/></svg>${ic(icon)}</span>`; }
  const mv = L.querySelector('.mv'); mv.setAttribute('stroke', col); mv.setAttribute('stroke-dashoffset', (C * (1 - s.soc / 100)).toFixed(1));
  if (Rr.textContent !== soc + '%') Rr.textContent = soc + '%';
  const pic = ic(VKIND[v.kind][0]) + (v.model3d ? `<img src="${window.ASSET_BASE || ''}img/veh-${v.model3d}.png" alt="" onerror="this.remove()">` : '');
  const sub = s.done ? (fee ? `Taxă de ocupare ${lei(idleFee(s))}` : idleLeft(s) === Infinity ? 'Încărcare completă' : `Gratuit încă ${clock(idleLeft(s))}`) : etaLine(s).replace(/^Până la \d+%: /, '');
  const x = d.querySelector('#dynX');
  /* prima dată construim structura; apoi schimbăm doar valorile, ca bara să curgă lin și butonul să nu se refacă */
  if (!x.firstElementChild) x.innerHTML = `<span class="dx-pic"></span><span class="dx-soc"><b></b><span></span></span><span class="dx-mid"><span class="dx-kw"></span><span class="dx-t"></span></span>
    <span class="dx-bar"><span class="dx-track"><i></i></span><span class="dx-row"><span class="dx-sub"></span><button type="button" data-dyn="open">Deschide</button></span></span>`;
  const put = (sel, html) => { const n = x.querySelector(sel); if (n.innerHTML !== html) n.innerHTML = html; };
  if (x.dataset.veh !== v.id) { x.dataset.veh = v.id; put('.dx-pic', pic); }
  put('.dx-soc b', soc + '%'); put('.dx-soc span', 'țintă ' + s.target + '%');
  put('.dx-kw', s.done ? 'Gata' : `${nf(s.kw, 1)}<small>kW</small>`); put('.dx-t', `${esc(v.name)} · ${esc(st.city)}`);
  put('.dx-sub', `${sub} · ${lei(sessTotal(s))}`); x.querySelector('.dx-track i').style.width = s.soc + '%';
  if (s.done && !ISL.lastDone) { islandPulse(); islandSet('expanded', 5000); }
  ISL.lastDone = s.done;
}
document.addEventListener('click', e => {
  const d = $('#dyn'); if (!d || d.hidden) return;
  if (e.target.closest('[data-dyn="open"]')) { e.stopPropagation(); islandSet('compact'); go('sesiune'); return; }
  if (e.target.closest('#dynC')) { islandSet('expanded', 6000); return; }
  if (e.target.closest('#dynX')) { islandSet('compact'); return; }
  if (ISL.state === 'expanded' && !e.target.closest('#dyn')) islandSet('compact');
}, true);
/* la revenirea în aplicație: insula se deschide scurt, ca să vezi unde a ajuns încărcarea */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.session && !$('#dyn').hidden) { islandPulse(); islandSet('expanded', 3500); } });
function islandOnStart() { ISL.lastDone = false; setTimeout(() => { islandRender(); if (!$('#dyn').hidden) { islandPulse(); islandSet('expanded', 3500); } }, 420); }

</script>
